{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | StudyPalz</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ========================================= */
        /* INHERITED DESIGN SYSTEM FROM HOME.HTML   */
        /* ========================================= */
        :root {
            --primary-teal: #06b6d4;
            --primary-teal-dark: #0891b2;
            --primary-teal-light: #67e8f9;
            --light-teal: #ecfeff;
            --dark-blue: #0f1729;
            --medium-blue: #475569;
            --text-muted: #64748b;
            --hero-gradient: linear-gradient(135deg, var(--dark-blue) 20%, var(--primary-teal) 80%);
            --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --white: #ffffff;
            --surface-light: #f8fafc;
            --border-light: #e2e8f0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--dark-blue);
            background-color: var(--white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Typography & Buttons */
        h1, h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--dark-blue); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.9rem 2rem; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: var(--transition); border: none; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; }
        .btn-primary { background: var(--accent-gradient); color: var(--white); box-shadow: 0 4px 14px 0 rgba(6, 182, 212, 0.35); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3); }
        .btn-secondary { background: var(--white); color: var(--dark-blue); border: 1px solid var(--border-light); }
        .btn-secondary:hover { border-color: var(--primary-teal); color: var(--primary-teal); background: var(--light-teal); }

        /* Header (Simplified for 404) */
        .header { position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%); width: calc(100% - 3rem); max-width: 1060px; z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(226,232,240,0.8); border-radius: 100px; padding: 0.7rem 1.75rem; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .header .container { padding: 0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--dark-blue); text-decoration: none; }
        .logo span { color: var(--primary-teal); }

        /* Background Blobs */
        .blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.3; z-index: 0; pointer-events: none; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--primary-teal-light); }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #dbeafe; }

        /* ========================================= */
        /* SPECIFIC 404 STYLES                      */
        /* ========================================= */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
            margin-top: 60px; /* Header offset */
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            background: var(--hero-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            /* Subtle animation */
            animation: float 6s ease-in-out infinite;
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 1rem;
        }

        .error-desc {
            max-width: 500px;
            margin: 0 auto 2.5rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            .header { display: none; } /* Hide header on mobile 404 for cleaner look */
            .error-container { margin-top: 0; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header class="header">
        <div class="container" style="width: 100%;">
            <a href="{% url 'home' %}" class="logo">StudyPalz</a>
            <a href="{% url 'home' %}" class="btn btn-secondary" style="padding: 0.5rem 1.2rem; font-size: 0.85rem;">Back to Home</a>
        </div>
    </header>

    <main class="error-container">
        <div class="error-code">404</div>
        
        <h2 class="error-title">Out of Syllabus?</h2>
        
        <p class="error-desc">
            The page you're looking for seems to have skipped the semester. 
            It might have been removed, renamed, or didn't exist in the first place.
        </p>

        <div class="btn-group">
            <a href="{% url 'home' %}" class="btn btn-primary">
                Return to Homepage
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                Go Back
            </a>
        </div>
    </main>

    </body>
</html>
