{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Attempts | StudyPalz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #06b6d4;
            --dark-blue: #0f172a;
            --medium-blue: #334155;
            --light-bg: #ecfeff;
            --white: #ffffff;
            --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --shadow-soft: 0 10px 40px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ecfeff 0%, #f8fafc 50%, #eff6ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-blue);
            overflow: hidden;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent-gradient);
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--primary-teal);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--dark-blue);
        }

        p {
            color: var(--medium-blue);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .timer-box {
            background: #f1f5f9;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            color: var(--medium-blue);
            display: inline-block;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        .timer-count {
            color: var(--primary-teal);
            font-variant-numeric: tabular-nums;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--dark-blue);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            background: #1e293b;
        }

        .home-btn.disabled {
            background: #cbd5e1;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Contact Section Styles */
        .contact-note {
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .contact-note p {
            margin-bottom: 0.3rem;
        }

        .contact-email {
            color: var(--primary-teal);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .contact-email:hover {
            color: var(--dark-blue);
            text-decoration: underline;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-card">
            <div class="icon-wrapper">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 22h14"></path>
                    <path d="M5 2h14"></path>
                    <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path>
                    <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
                </svg>
            </div>

            <h1>Whoa, slow down!</h1>
            <p>We've detected too many requests from your device. To keep StudyPalz fast for everyone, please wait a moment.</p>

            <div class="timer-box">
                Try again in <span id="countdown" class="timer-count">60</span> seconds
            </div>

            <div>
                <a href="/" id="retryBtn" class="home-btn disabled">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 3v9h9"></path></svg>
                    Refresh Page
                </a>
            </div>

            <div class="contact-note">
                <p>If this was by mistake, don't worry!</p>
                <span>Whatsapp us: </span>
               <a href="tel:+919529307125" class="contact-phone">
  9529307125
</a>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 600; // Adjust based on your rate limit settings
        const countdownEl = document.getElementById('countdown');
        const retryBtn = document.getElementById('retryBtn');
        const timerBox = document.querySelector('.timer-box');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = "0";

                // Enable button
                retryBtn.classList.remove('disabled');

                // Update text
                timerBox.innerHTML = "You can try again now!";
                timerBox.style.color = "#059669";
                timerBox.style.background = "#d1fae5";
                timerBox.style.borderColor = "#6ee7b7";
            }
        }, 1000);
    </script>

</body>
</html>
